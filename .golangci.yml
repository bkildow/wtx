version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - gosec
    - errorlint
    - misspell
    - unconvert
    - revive
    - unparam
  disable:
    - depguard
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - style
    gosec:
      # wtx is a local CLI that operates on paths from the user's own project and
      # launches the editor they configured, so these rules fire on the tool
      # doing exactly what it exists to do. G702/G703 are the taint-analysis
      # equivalents of G204/G304, which were already excluded below.
      excludes:
        - G122 # symlink TOCTOU in filepath.WalkDir over the user's shared/ tree
        - G204
        - G301
        - G304
        - G306
        - G702 # subprocess launched with a variable (the configured editor)
        - G703 # path traversal via variable (paths from the user's project)
    revive:
      rules:
        - name: package-comments
        - name: exported
          disabled: true

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
