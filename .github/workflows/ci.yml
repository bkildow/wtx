name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS are the supported platforms; wt no longer builds for
        # Windows.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Install shells for compatibility tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Test
        run: go test ./... -count=1

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Mirrors the goreleaser build matrix so a release cannot be the first
      # place a broken target shows up.
      - name: Build release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/wtx
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/wt
          done

  lint:
    name: lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Platform-specific files compile for exactly one GOOS, so linting a
        # single target silently skips the rest -- which is how a Linux-only
        # finding in internal/disk/stat.go stayed hidden while lint was run
        # on macOS.
        goos: [linux, darwin]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.12.2
