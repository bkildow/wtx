version: 2

# Pinned explicitly. GoReleaser otherwise infers this from the git remote,
# which is now "wtx" — that would silently rename the release archives and
# break the published Casks/wt.rb, whose URLs are wt-cli_<version>_<os>_<arch>.
# Flip this to "wtx" only together with the cmd/wtx binary rename and the new cask.
project_name: wt-cli

builds:
  - id: wt
    main: ./cmd/wt
    binary: wt
    ldflags:
      - -s -w
      - -X github.com/bkildow/wtx/cmd.version={{.Version}}
      - -X github.com/bkildow/wtx/cmd.commit={{.ShortCommit}}
      - -X github.com/bkildow/wtx/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: wt
    repository:
      owner: bkildow
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/bkildow/wtx"
    description: "CLI for managing git worktree-based development workflows"
    license: "MIT"
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    # Clear the macOS quarantine attribute so the unsigned binary runs without
    # a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wt"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - "^Merge"
