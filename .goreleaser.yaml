version: 2

# Both command names ship together throughout the compatibility transition.
project_name: wtx

builds:
  - id: wtx
    main: ./cmd/wtx
    binary: wtx
    ldflags:
      - -s -w
      - -X github.com/bkildow/wtx/cmd.version={{.Version}}
      - -X github.com/bkildow/wtx/cmd.commit={{.ShortCommit}}
      - -X github.com/bkildow/wtx/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
  - id: wt
    main: ./cmd/wt
    binary: wt
    ldflags:
      - -s -w
      - -X github.com/bkildow/wtx/cmd.version={{.Version}}
      - -X github.com/bkildow/wtx/cmd.commit={{.ShortCommit}}
      - -X github.com/bkildow/wtx/cmd.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - wtx
      - wt
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: wtx
    binaries:
      - wtx
      - wt
    repository:
      owner: bkildow
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/bkildow/wtx"
    description: "CLI for managing git worktree-based development workflows"
    license: "MIT"
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    # Clear the macOS quarantine attribute so the unsigned binary runs without
    # a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wtx"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/wt"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - "^Merge"
